<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      font-family: Inter, sans-serif;
    }
    #take-cam {
      position: absolute;
      inset: 0;
      transform-origin: 960px 540px;
    }
    #take-video {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      object-fit: contain;
    }
    /* The real mouse, drawn at the position the capture recorded on every frame. */
    #take-cursor {
      position: absolute;
      left: 0;
      top: 0;
      width: 34px;
      height: 46px;
      opacity: 0;
    }
    #take-cursor svg {
      display: block;
      width: 34px;
      height: 46px;
      transform-origin: 3px 3px;
      overflow: visible;
    }
    .take-title {
      position: absolute;
      color: var(--ink, #181a1d);
      font-weight: 600;
      font-size: 64px;
      line-height: 1.08;
      letter-spacing: -0.02em;
      text-shadow: 0 0 24px rgba(246, 243, 238, 0.95), 0 0 6px rgba(246, 243, 238, 0.9);
    }
    .take-title .w {
      display: inline-block;
      opacity: 0;
    }
    .take-title .accent {
      color: var(--accent, #be6c3c);
    }
    #take-q {
      left: 352px;
      top: 126px;
      width: 420px;
    }
    #take-walk {
      left: 0;
      width: 1920px;
      top: 792px;
      text-align: center;
    }
  </style>
  <div data-hf-id="hf-h5vc" id="root" data-composition-id="take" data-width="1920" data-height="1080">
    <div data-hf-id="hf-530b" id="take-cam" data-layout-allow-overflow>
      <video data-hf-id="hf-kkdp"
        id="take-video"
        class="clip"
        src="assets/footage/app-take.mp4"
        muted
        playsinline
        data-start="0"
        data-duration="37.4"
        data-track-index="0"></video>
      <div data-hf-id="hf-qhjf" id="take-cursor">
        <svg data-hf-id="hf-kvp8" viewBox="0 0 34 46">
          <path data-hf-id="hf-aanx" d="M3 3 L3 37 L11.5 29 L17 41.5 L22.5 39 L17 27 L28.5 27 Z" fill="#181a1d" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round" />
        </svg>
      </div>
    </div>

    <div data-hf-id="hf-v8l5" id="take-q" class="take-title">
      <span data-hf-id="hf-usq2" class="w">Can</span> <span data-hf-id="hf-0i30" class="w">this</span> <span data-hf-id="hf-jt1e" class="w accent">wall</span> <span data-hf-id="hf-lenv" class="w">go?</span>
    </div>
    <div data-hf-id="hf-etgb" id="take-walk" class="take-title">
      <span data-hf-id="hf-0wdc" class="w">Now</span> <span data-hf-id="hf-a4ux" class="w">walk</span> <span data-hf-id="hf-kw8r" class="w">in.</span>
    </div>
  </div>
  <script src="assets/footage/take.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });
    const take = window.__take;
    const C = { x: 960, y: 540 };

    // Camera on the footage: scale s about the frame centre, with page point P brought to screen point T.
    const focus = (P, s, T = C) => ({ scale: s, x: T.x - C.x - (P.x - C.x) * s, y: T.y - C.y - (P.y - C.y) * s });
    const cam = (vars, at, duration, ease = "power2.inOut") => tl.to("#take-cam", { ...vars, duration, ease }, at);

    // Opens punched in on the 3D view (no chrome), matched to the paper plan; pulls back to the whole app.
    tl.set("#take-cam", { ...focus(C, 1.6), filter: "blur(0px)", opacity: 1 }, 0);
    cam(focus(C, 1), 1.0, 2.6);

    // The budget pill after the hack.
    cam(focus({ x: 1656, y: 40 }, 1.9, { x: 1380, y: 300 }), 8.05, 0.5);
    cam(focus(C, 1), 8.95, 0.5);

    // Zoom through the stage as the camera dives into the living room; out again at the bedroom.
    cam(focus({ x: 960, y: 590 }, 1.5), 20.95, 1.0);
    cam(focus(C, 1), 32.1, 1.0);

    // The report: the estimated total, then the HDB checks.
    cam(focus({ x: 920, y: 165 }, 1.55, { x: 960, y: 360 }), 33.85, 0.5);
    cam(focus(C, 1), 34.9, 0.4);
    cam(focus({ x: 960, y: 400 }, 1.25, { x: 960, y: 500 }), 35.8, 0.6);

    // Hand-off to the end card: the report shrinks away and softens.
    tl.to("#take-cam", { scale: 0.78, x: 0, y: 0, filter: "blur(6px)", duration: 0.5, ease: "power3.in" }, 36.9);
    tl.to("#take-cam", { opacity: 0, duration: 0.2, ease: "power1.in" }, 37.2);

    // Cursor: one tween that reads the recorded track; visibility fades over 0.2 s at each window's edges.
    const cursor = document.getElementById("take-cursor");
    const arrow = cursor.querySelector("svg");
    const windows = [[4.3, 21.5], [32.7, 37.4]];
    const clamp01 = (v) => Math.max(0, Math.min(1, v));
    const state = { t: 0 };
    tl.to(state, {
      t: take.duration,
      duration: take.duration,
      ease: "none",
      onUpdate() {
        const t = state.t;
        const f = Math.min(take.track.length - 1, Math.max(0, Math.round(t * take.fps)));
        const [x, y, , pressed] = take.track[f];
        let op = 0;
        for (const [a, b] of windows) op = Math.max(op, clamp01((t - a) / 0.2) * clamp01((b - t) / 0.2));
        cursor.style.transform = `translate(${x - 3}px, ${y - 3}px)`;
        cursor.style.opacity = op;
        // A click: the arrow dips for 3 frames; held down (the slider drag) it stays dipped.
        const click = take.events.some((e) => e.click && t >= e.t && t < e.t + 0.1);
        arrow.style.transform = pressed || click ? "scale(0.86)" : "scale(1)";
      },
    }, 0);

    // Titles: per word, blur to sharp, no movement; out with a quick blur.
    const words = (sel, at) => {
      tl.fromTo(`${sel} .w`, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "expo.out", stagger: 0.067 }, at);
    };
    const out = (sel, at) => tl.to(`${sel} .w`, { opacity: 0, filter: "blur(6px)", duration: 0.16, ease: "power2.in", stagger: 0.03 }, at);
    words("#take-q", 3.7);
    out("#take-q", 5.25);
    words("#take-walk", 21.6);
    out("#take-walk", 23.1);

    window.__timelines["take"] = tl;
  </script>
</template>
