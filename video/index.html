<!doctype html>
<html

    {"id":"chipKicker","type":"string","label":"Plan chip: small line","default":"Blk 147A Redhill Peaks · 4-Room"},
    {"id":"chipText","type":"string","label":"Plan chip: main line","default":"Upload floor plan"},
    {"id":"productName","type":"string","label":"End card: name","default":"Redhill Peaks Studio"},
    {"id":"productSub","type":"string","label":"End card: subtitle","default":"3D interior design for our BTO flat"},
    {"id":"url","type":"string","label":"End card: URL","default":"weihaowh.github.io/RedhillPeaks"},
    {"id":"smallPrint","type":"string","label":"End card: small print","default":"Planning aid. Prices are indicative; HDB checks are guidance, not approval."},

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --accent: #be6c3c;
        --ink: #181a1d;
        --muted: #6c7179;
        --stage: #f6f3ee;
        --paper: #f2f1ee;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--stage);
        font-family: Inter, sans-serif;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
      }
      #plan {
        z-index: 3;
      }
      #take {
        z-index: 2;
      }
      #endcard {
        z-index: 4;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-adpn" id="root" data-composition-id="main" data-start="0" data-duration="44.3" data-width="1920" data-height="1080">
      <!-- Scenes: the paper plan, the one take in the real app (film = footage + 3.0 s), the end card. -->
